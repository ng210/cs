<div class="card-back">
    <h1 name="day">{{day}}. nap</h1>
    <h2 name="date">{{date}}</h2>
</div>

<div class="card-front">
    <div name="question">{{question}}</div>
    <div class="answer">
        <div class="select">
            <span><label for="options"></label><input name="options" type="radio"/></span>
        </div>
        <div class="text">
            <input name="text" type="text" />
        </div>
    </div>
    <button>Ok</button>
</div>
